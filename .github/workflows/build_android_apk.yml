name: Build Android APK (Galaxy A55 5G)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space on Runner
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker image prune --all --force
        df -h

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache

    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0" virtualenv
        pip install git+https://github.com/kivy/buildozer.git

    - name: Clone and Patch python-for-android
      run: |
        git clone --depth 1 https://github.com/kivy/python-for-android.git p4a_dir
        python3 -c "
        path = 'p4a_dir/pythonforandroid/recipes/libthorvg/__init__.py'
        with open(path, 'r') as f:
            code = f.read()
        target = 'pattern = join(self.ctx.ndk.llvm_prebuilt_dir, \"lib/clang/*/lib/linux\", lib_arch)\n            clang_lib_dir = glob(pattern)[0]\n            libomp = join(clang_lib_dir, \"libomp.so\")\n            shprint(sh.cp, libomp, join(\"install\", \"lib\"))'
        replacement = 'libomps = glob(join(self.ctx.ndk.llvm_prebuilt_dir, \"**\", \"libomp.so\"), recursive=True)\n            for f in libomps:\n                if lib_arch in f:\n                    shprint(sh.cp, f, join(\"install\", \"lib\"))\n                    break'
        if target in code:
            code = code.replace(target, replacement)
            with open(path, 'w') as f:
                f.write(code)
            print('Successfully patched libthorvg libomp path!')
        else:
            print('Warning: target string not found, attempting fallback replacement')
            code = code.replace('\"lib/clang/*/lib/linux\"', '\"lib*/clang/*/lib/linux\"')
            with open(path, 'w') as f:
                f.write(code)
        "
        pip install ./p4a_dir

    - name: Build Android APK with Buildozer
      working-directory: android_app
      run: |
        if [ -d "/usr/local/lib/android/sdk/ndk/25.2.9519653" ]; then
          export ANDROID_NDK="/usr/local/lib/android/sdk/ndk/25.2.9519653"
          export ANDROID_NDK_HOME="/usr/local/lib/android/sdk/ndk/25.2.9519653"
        else
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_LATEST_HOME
        fi
        export CFLAGS="$CFLAGS -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
        export CPPFLAGS="$CPPFLAGS -Wno-error=implicit-function-declaration"
        export CHARSET_NORMALIZER_USE_MYPYC=0

        set -o pipefail
        buildozer android debug 2>&1 | tee ../buildozer_output.txt || {
          echo "### Buildozer Fehlerbericht (Letzte 100 Zeilen)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 ../buildozer_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        }

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UniversalMediaConverter-GalaxyA55.apk
        path: android_app/bin/*.apk
