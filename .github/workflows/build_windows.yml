name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller -r 1_resources/requirements.txt

    - name: Download Windows FFmpeg
      run: |
        Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile '1_resources/ffmpeg.zip'
        Expand-Archive -Path '1_resources/ffmpeg.zip' -DestinationPath '1_resources/ffmpeg_tmp'
        Copy-Item '1_resources/ffmpeg_tmp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe' '1_resources/ffmpeg.exe'
        Copy-Item '1_resources/ffmpeg_tmp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe' '1_resources/ffprobe.exe'
        Remove-Item -Recurse -Force '1_resources/ffmpeg_tmp'
        Remove-Item -Force '1_resources/ffmpeg.zip'

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --distpath 4_final/dist_windows --workpath 4_final/build_windows 1_resources/UniversalMediaConverter_windows.spec

    - name: Install Inno Setup & Build Setup.exe
      run: |
        choco install innosetup --no-progress
        & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" 1_resources/installer.iss

    - name: Upload Setup.exe Installer
      uses: actions/upload-artifact@v4
      with:
        name: UniversalMediaConverter_Setup
        path: 4_final/UniversalMediaConverter_Setup.exe
